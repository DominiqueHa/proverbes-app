apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: proverbes-tls
  namespace: {{ .Values.namespace }}
spec:
  secretName: proverbes-tls-secret
  issuerRef:
    name: proverbes-ca-issuer
    kind: ClusterIssuer
  commonName: proverbes.local
  ipAddresses:
    - 192.168.100.161
    - 127.0.0.1
